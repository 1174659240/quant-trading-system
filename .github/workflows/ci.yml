name: 检查

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 仓库纪律
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 体积 / 数据文件 / 凭据 / 冻结证据 / 台账
        shell: bash
        run: |
          out=$(python scripts/repo_guard.py 2>&1) && { echo "$out"; exit 0; }
          code=$?
          echo "$out"
          printf '%s\n' "$out" | grep -E '\[失败\]|✗|ERROR|Traceback' | tail -8 | while IFS= read -r l; do
            echo "::error::$l"
          done
          exit $code

  tests:
    name: 离线测试 py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: pip install "pandas>=3.0,<4" "numpy>=2.0" "pyarrow>=15" "requests>=2.28"
      - name: 逐套件跑（每套件独立进程，避免跨套件全局状态污染）
        shell: bash
        run: |
          python tests/run_all.py --list | awk -F'\t' '$2=="offline"{print $1}' > suites.txt
          echo "本次运行：$(tr '\n' ' ' < suites.txt)"
          status=0
          while read -r suite; do
            echo "::group::$suite"
            if out=$(python tests/run_all.py --suite "$suite" 2>&1); then
              printf '%s\n' "$out" | tail -2
            else
              status=1
              printf '%s\n' "$out"
              echo "::error::套件 $suite 失败"
              printf '%s\n' "$out" | grep -E 'FAIL|AssertionError|Error|Traceback|✗' | tail -6 | while IFS= read -r l; do
                echo "::error::[$suite] $l"
              done
            fi
            echo "::endgroup::"
          done < suites.txt
          echo "需要数据湖而跳过：$(python tests/run_all.py --list | awk -F'\t' '$2=="lake"{print $1}' | tr '\n' ' ')"
          exit $status
